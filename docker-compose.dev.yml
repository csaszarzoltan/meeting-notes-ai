# Development object storage (MinIO) — analysis brief §10 (AC6)
#
# Start:   docker compose -f docker-compose.dev.yml up -d minio
# Console: http://localhost:9001 (minioadmin / minioadmin)
# Tests:   STORAGE_BACKEND=s3 S3_ENDPOINT_URL=http://localhost:9000 \
#          S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin
#
# NOTE: dev credentials only — never use these in production.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio-data:
