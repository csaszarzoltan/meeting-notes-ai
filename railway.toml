[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Start command with PORT expansion
startCommand = "uvicorn meeting_notes_ai.main:app --host 0.0.0.0 --port ${PORT:-8000}"

[environments.production]
variables = { ENVIRONMENT = "production", LOG_LEVEL = "info", PYTHONUNBUFFERED = "1" }

[environments.staging]
variables = { ENVIRONMENT = "staging", LOG_LEVEL = "debug" }
